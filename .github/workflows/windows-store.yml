name: Windows Store MSIX

# Builds a self-contained MSIX package for the Microsoft Store.
# No Authenticode certificate purchase required:
#   - We self-sign with a fresh cert generated in CI.
#   - Microsoft re-signs the package when you submit via Partner Center.
#   - End users install from the Store, which carries Microsoft's signature.
#
# Partner Center identity values (Store ID: 9PKJ83V2S357):
#   identity_name : PmatzSolutions.Cafezin
#   publisher_cn  : CN=A18A6B2B-9CDD-4D86-822D-3131CE1CC3EE
#
# Called automatically by release.yml via workflow_call, or manually via
# workflow_dispatch.
#
# auto_submit (default: false):
#   When true, submits the MSIX directly to Partner Center after building.
#   Requires these GitHub secrets to be set:
#     MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET,
#     MS_STORE_SELLER_ID, MS_STORE_APP_ID
#   See pedrin/scripts/submit-windows-store.py for one-time setup instructions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.2.0)"
        required: true
      identity_name:
        description: "Package Identity Name from Partner Center"
        required: false
        default: "PmatzSolutions.Cafezin"
      publisher_cn:
        description: "Publisher CN from Partner Center"
        required: false
        default: "CN=A18A6B2B-9CDD-4D86-822D-3131CE1CC3EE"
      auto_submit:
        description: "Submit to Partner Center after building? (requires MS_STORE_* secrets)"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      tag:
        description: "Version tag (e.g. v0.2.0)"
        required: true
        type: string
      identity_name:
        required: false
        type: string
        default: "PmatzSolutions.Cafezin"
      publisher_cn:
        required: false
        type: string
        default: "CN=A18A6B2B-9CDD-4D86-822D-3131CE1CC3EE"
      auto_submit:
        description: "Submit to Partner Center after building?"
        type: boolean
        required: false
        default: false
    secrets:
      GH_PACKAGES_TOKEN:
        required: true
      VITE_SUPABASE_URL:
        required: true
      VITE_SUPABASE_ANON_KEY:
        required: true
      MS_STORE_TENANT_ID:
        required: false
      MS_STORE_CLIENT_ID:
        required: false
      MS_STORE_CLIENT_SECRET:
        required: false
      MS_STORE_SELLER_ID:
        required: false
      MS_STORE_APP_ID:
        required: false

env:
  APP_NAME: Cafezin

jobs:
  build-msix:
    name: Windows Store MSIX
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Build the Rust binary via the Tauri CLI (not cargo directly).
      # Using "tauri build --no-bundle" ensures the CLI sets the correct
      # production-mode env vars (TAURI_ENV_DEBUG=false, TAURI_ENV_PLATFORM, etc.)
      # so tauri-build embeds the frontend assets properly.
      # The CLI also runs "npm run build" (beforeBuildCommand) internally,
      # so no separate frontend build step is needed here.
      # --features msix makes build_channel() return "msix", disabling the
      # in-app GitHub updater (Microsoft Store handles updates for MSIX installs).
      - name: Build Cafezin binary
        run: npx tauri build --no-bundle --features msix
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Convert the semver tag (v0.2.0) into a 4-part MSIX version (0.2.0.0).
      - name: Parse version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ inputs.tag }}".TrimStart('v')
          $parts = $ver.Split('.')
          while ($parts.Count -lt 4) { $parts += @('0') }
          "ver=$ver"           >> $env:GITHUB_OUTPUT
          "msix_ver=$($parts[0..3] -join '.')" >> $env:GITHUB_OUTPUT

      # Generate a self-signed cert in CI — no purchased certificate required.
      # Microsoft re-signs the MSIX when you submit it to Partner Center.
      - name: Generate self-signed certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "${{ inputs.publisher_cn }}" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Cafezin MSIX Signing" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Stage the binary and scaled icon assets into the MSIX folder layout.
      - name: Create MSIX package structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "msix-pkg/Assets" -Force | Out-Null

          # Main binary — take the largest exe at the root of target/release/
          $exe = Get-ChildItem "app/src-tauri/target/release/*.exe" `
            | Sort-Object Length -Descending `
            | Select-Object -First 1
          Copy-Item $exe.FullName "msix-pkg/Cafezin.exe"

          # Scale icons from the existing 128x128 asset
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile(
            (Resolve-Path "app/src-tauri/icons/128x128.png").Path
          )
          foreach ($a in @(
            @{ Name = "Square44x44Logo";   W = 44;  H = 44  },
            @{ Name = "Square150x150Logo"; W = 150; H = 150 },
            @{ Name = "StoreLogo";         W = 50;  H = 50  },
            @{ Name = "Wide310x150Logo";   W = 310; H = 150 }
          )) {
            $bmp = New-Object System.Drawing.Bitmap($a.W, $a.H)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($src, 0, 0, $a.W, $a.H)
            $g.Dispose()
            $bmp.Save("msix-pkg/Assets/$($a.Name).png",
              [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          $src.Dispose()

      # Fill placeholders in the template file that lives in the repo.
      # Avoids PowerShell heredocs, which conflict with YAML literal block indentation.
      - name: Write AppxManifest.xml
        shell: pwsh
        run: |
          (Get-Content "app/src-tauri/AppxManifest.xml.template" -Raw) `
            -replace '__IDENTITY_NAME__', '${{ inputs.identity_name }}' `
            -replace '__PUBLISHER_CN__',  '${{ inputs.publisher_cn }}' `
            -replace '__MSIX_VERSION__',  '${{ steps.version.outputs.msix_ver }}' |
            Set-Content "msix-pkg/AppxManifest.xml" -Encoding UTF8

      - name: Package MSIX with makeappx
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "makeappx.exe" `
            | Where-Object { $_.FullName -match "x64" } `
            | Sort-Object FullName -Descending `
            | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe not found — Windows SDK may not be installed on this runner" }
          & $makeappx pack /d msix-pkg /p Cafezin.msix /o

      # Self-signed signature satisfies makeappx; Partner Center replaces it with Microsoft's cert.
      - name: Sign MSIX with self-signed certificate
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" `
            | Where-Object { $_.FullName -match "x64" } `
            | Sort-Object FullName -Descending `
            | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd sha256 /sha1 "${{ steps.cert.outputs.thumbprint }}" Cafezin.msix

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash Cafezin.msix -Algorithm SHA256).Hash.ToLower() + "  Cafezin.msix" | Set-Content Cafezin.msix.sha256

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: |
            Cafezin.msix
            Cafezin.msix.sha256
          if-no-files-found: error

      # ── Optional auto-submit ─────────────────────────────────────────────
      # Submits the MSIX directly to Partner Center via the Submission API.
      # Enable by setting auto_submit: true + adding the MS_STORE_* secrets.
      - name: Submit to Microsoft Store
        if: ${{ inputs.auto_submit == true }}
        shell: pwsh
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: |
          python -m pip install --quiet requests 2>$null
          python - <<'PYEOF'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request, zipfile, tempfile

          API_BASE  = "https://manage.devcenter.microsoft.com/v1.0/my"
          TOKEN_URL = "https://login.microsoftonline.com/{}/oauth2/v2.0/token"
          SCOPE     = "https://manage.devcenter.microsoft.com/.default"

          def require(name):
              val = os.environ.get(name)
              if not val: sys.exit(f"Missing secret: {name}")
              return val

          def get_token(tid, cid, csec):
              data = urllib.parse.urlencode({"grant_type":"client_credentials","client_id":cid,"client_secret":csec,"scope":SCOPE}).encode()
              req = urllib.request.Request(TOKEN_URL.format(tid), data=data, method="POST")
              with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)["access_token"]

          def api(method, path, token, body=None):
              req = urllib.request.Request(f"{API_BASE}{path}", data=json.dumps(body).encode() if body else None, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=60) as r: return json.loads(r.read() or b"{}")

          token = get_token(require("MS_STORE_TENANT_ID"), require("MS_STORE_CLIENT_ID"), require("MS_STORE_CLIENT_SECRET"))
          app_id = require("MS_STORE_APP_ID")

          app = api("GET", f"/applications/{app_id}", token)
          pending = app.get("pendingApplicationSubmission", {})
          if pending.get("id"):
              print(f"Deleting pending submission {pending['id']}")
              api("DELETE", f"/applications/{app_id}/submissions/{pending['id']}", token)

          print("Creating submission...")
          sub = api("POST", f"/applications/{app_id}/submissions", token)
          sub_id, sas_url = sub["id"], sub["fileUploadUrl"]
          print(f"Submission ID: {sub_id}")

          pkgs = sub.get("applicationPackages", [])
          pkgs = [p for p in pkgs if not p.get("fileName","").lower().endswith(".msix")]
          pkgs.append({"fileName": "Cafezin.msix", "fileStatus": "PendingUpload"})
          sub["applicationPackages"] = pkgs
          api("PUT", f"/applications/{app_id}/submissions/{sub_id}", token, body=sub)

          tmp = tempfile.mktemp(suffix=".zip")
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zf: zf.write("Cafezin.msix", "Cafezin.msix")
          size = os.path.getsize(tmp)
          print(f"Uploading {size/1024/1024:.1f} MB...")
          with open(tmp, "rb") as f:
              req = urllib.request.Request(sas_url, data=f, method="PUT")
              req.add_header("x-ms-blob-type", "BlockBlob")
              req.add_header("Content-Length", str(size))
              with urllib.request.urlopen(req, timeout=600) as r: print(f"Upload: {r.status}")
          os.unlink(tmp)

          api("POST", f"/applications/{app_id}/submissions/{sub_id}/commit", token)
          print(f"\n✅ Submitted! ID: {sub_id}")
          print(f"Track: https://partner.microsoft.com/en-us/dashboard/products/{app_id}/submissions/{sub_id}")
          PYEOF
